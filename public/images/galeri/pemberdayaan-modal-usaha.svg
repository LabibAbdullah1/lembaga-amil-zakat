<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" />

  <rect x="50" y="45" width="225" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
  <circle cx="68" cy="63" r="6" fill="#FBBF24" />
  <text x="84" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#FEF3C7" letter-spacing="0.5">ZAKAT MAL PRODUKTIF</text>

  <!-- Illustration: Cart & Trending Growth -->
  <g transform="translate(500, 160)">
    <!-- Roda Gerobak -->
    <circle cx="70" cy="210" r="30" fill="#1E293B" stroke="#F59E0B" stroke-width="4" />
    <circle cx="70" cy="210" r="10" fill="#F59E0B" />
    <circle cx="170" cy="210" r="30" fill="#1E293B" stroke="#F59E0B" stroke-width="4" />
    <circle cx="170" cy="210" r="10" fill="#F59E0B" />
    <!-- Bodi Gerobak Usaha -->
    <rect x="40" y="100" width="160" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))" />
    <!-- Atap Gerobak -->
    <path d="M 30 100 L 120 50 L 210 100 Z" fill="#D97706" stroke="#B45309" stroke-width="2" />
    <!-- Tulisan Binaan -->
    <rect x="55" y="125" width="130" height="30" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
    <text x="120" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">GEROBAK BERKAH</text>
  </g>

  <!-- Typography Content -->
  <g transform="translate(50, 130)">
    <text x="0" y="45" font-family="'Newsreader', serif" font-size="34" font-weight="600" fill="#FFFFFF" line-height="1.2">
      Modal Usaha Produktif
    </text>
    <text x="0" y="85" font-family="'Newsreader', serif" font-size="30" font-weight="400" fill="#FDE68A">
      Pemberdayaan Asnaf Miskin
    </text>

    <!-- Info Chips -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="165" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#FDE68A">Penerima Binaan</text>
      <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">12 Kepala Keluarga</text>

      <rect x="180" y="0" width="180" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="196" y="24" font-family="sans-serif" font-size="11" fill="#FDE68A">Bantuan Per Gerobak</text>
      <text x="196" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Rp 5.000.000</text>
    </g>

    <text x="0" y="240" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" font-style="italic">
      "Mengubah mustahik penerima menjadi muzaki mandiri melalui kemandirian ekonomi keluarga."
    </text>
  </g>

  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.4)" />
  <text x="50" y="485" font-family="sans-serif" font-size="12" fill="#E2E8F0">📊 Program Penyaluran Zakat Mal Profesi (ZKT-PRF) • Asnaf Miskin Produktif</text>
</svg>
