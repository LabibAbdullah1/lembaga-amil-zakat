<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <pattern id="pat2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.15)" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" />
  <rect width="800" height="500" fill="url(#pat2)" />

  <rect x="50" y="45" width="230" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
  <circle cx="68" cy="63" r="6" fill="#38BDF8" />
  <text x="84" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#E0F2FE" letter-spacing="0.5">SANTUNAN &amp; PENDIDIKAN</text>

  <!-- Illustration: Graduation Cap, Books & Gift Box -->
  <g transform="translate(510, 150)">
    <!-- Buku Tumpukan -->
    <rect x="20" y="210" width="180" height="30" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
    <rect x="30" y="180" width="160" height="30" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="2" />
    <rect x="40" y="150" width="140" height="30" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
    <!-- Toga / Graduation Cap -->
    <path d="M 110 50 L 190 85 L 110 120 L 30 85 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))" />
    <rect x="75" y="105" width="70" height="30" rx="4" fill="#1E293B" />
    <path d="M 190 85 Q 205 130 195 150" fill="none" stroke="#F59E0B" stroke-width="3.5" />
    <circle cx="195" cy="155" r="5" fill="#F59E0B" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(50, 130)">
    <text x="0" y="45" font-family="'Newsreader', serif" font-size="34" font-weight="600" fill="#FFFFFF" line-height="1.2">
      Beasiswa Pendidikan Yatim
    </text>
    <text x="0" y="85" font-family="'Newsreader', serif" font-size="30" font-weight="400" fill="#BAE6FD">
      &amp; Perlengkapan Masuk Sekolah
    </text>

    <!-- Info Chips -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="165" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#7DD3FC">Penerima Manfaat</text>
      <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">85 Anak Yatim</text>

      <rect x="180" y="0" width="180" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="196" y="24" font-family="sans-serif" font-size="11" fill="#7DD3FC">Bantuan Tunai &amp; Alat</text>
      <text x="196" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Rp 42.500.000</text>
    </g>

    <text x="0" y="240" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" font-style="italic">
      "Menjamin kelangsungan studi generasi penerus umat tanpa terbebani tunggakan SPP."
    </text>
  </g>

  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.4)" />
  <text x="50" y="485" font-family="sans-serif" font-size="12" fill="#E2E8F0">📍 Aula Serbaguna Masjid Istiqamah • Program Penyaluran Dana Santunan Yatim &amp; Dhuafa</text>
</svg>
