<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" />

  <rect x="50" y="45" width="220" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
  <circle cx="68" cy="63" r="6" fill="#4ADE80" />
  <text x="84" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#DCFCE7" letter-spacing="0.5">LAYANAN AMIL RESMI</text>

  <!-- Illustration: Receipt & Handshake of Trust -->
  <g transform="translate(510, 150)">
    <!-- Meja Loket -->
    <rect x="10" y="220" width="210" height="30" rx="4" fill="#334155" />
    <!-- Kwitansi / Slip Penerimaan -->
    <rect x="40" y="60" width="150" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.3))" />
    <rect x="60" y="85" width="80" height="12" rx="3" fill="#16A34A" />
    <line x1="60" y1="120" x2="160" y2="120" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="135" x2="140" y2="135" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="150" x2="170" y2="150" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <!-- Stempel Sah Amil -->
    <circle cx="145" cy="185" r="22" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="3 2" />
    <text x="145" y="188" font-family="sans-serif" font-size="8" font-weight="bold" fill="#DC2626" text-anchor="middle">LUNAS / SAH</text>
  </g>

  <!-- Typography Content -->
  <g transform="translate(50, 130)">
    <text x="0" y="45" font-family="'Newsreader', serif" font-size="34" font-weight="600" fill="#FFFFFF" line-height="1.2">
      Pelayanan Loket ZIS
    </text>
    <text x="0" y="85" font-family="'Newsreader', serif" font-size="30" font-weight="400" fill="#BBF7D0">
      Kwitansi Resmi &amp; Ijab Kabul
    </text>

    <!-- Info Chips -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="165" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#86EFAC">Muzaki Terlayani</text>
      <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1.420 Transaksi</text>

      <rect x="180" y="0" width="180" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" />
      <text x="196" y="24" font-family="sans-serif" font-size="11" fill="#86EFAC">Sistem Pencatatan</text>
      <text x="196" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Real-Time Cetak</text>
    </g>

    <text x="0" y="240" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" font-style="italic">
      "Setiap donasi dicatat langsung dengan nomor kwitansi BKK/BKM resmi dan doa ijab kabul."
    </text>
  </g>

  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.4)" />
  <text x="50" y="485" font-family="sans-serif" font-size="12" fill="#E2E8F0">🕌 Posko Pelayanan Amil Masjid Istiqamah • Transparansi Penghimpunan Umat</text>
</svg>
